[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app", "modules"]

[project]
name = "invarpay"
version = "0.1.0"
description = "InvarPay AI — Invariant-First Financial Operations Platform (Reliability, Fraud Intelligence, Dev Tools, Merchant Finance, Agentic Commerce)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",

    # Redis / queuing
    "redis[hiredis]>=5.0.4",
    "arq>=0.26.1",

    # Auth & security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=42.0.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",

    # HTTP client (provider adapters)
    "httpx>=0.27.0",

    # AI / LLM
    "langgraph>=0.1.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "openai>=1.30.0",

    # Observability
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "prometheus-client>=0.20.0",

    # Utilities
    "structlog>=24.1.0",
    "ulid-py>=1.1.0",
    "orjson>=3.10.3",
    "python-dotenv>=1.0.1",
    "typer>=0.12.0",
    "rich>=13.7.1",
]

[project.scripts]
invarpay = "apps.cli.main:app"
payguard = "apps.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=25.3.0",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
    "types-passlib",
    "types-python-jose",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "apps/api/alembic",
    "apps/api/alembic/versions",
    "alembic",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4"]
ignore = [
    "E501",   # Line too long
    "B008",   # Do not perform function calls in argument defaults (FastAPI Depends/Security/Query)
    "B904",   # Within an except clause, raise exceptions with raise ... from err
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "T20"]
"examples/**/*.py" = ["S101", "ANN", "T20"]
"apps/cli/**/*.py" = ["T201", "S310", "ANN"]
"apps/mcp/**/*.py" = ["T201", "S310", "ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=apps/api/app --cov=modules --cov-report=term-missing --cov-report=html"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
omit = ["tests/*", "examples/*", "alembic/*"]
