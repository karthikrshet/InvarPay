services:
  - type: web
    name: invarpay-api
    env: python
    buildCommand: "pip install -e ."
    startCommand: "uvicorn apps.api.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////tmp/payguard.db
