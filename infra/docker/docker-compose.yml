version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: payguard_postgres
    environment:
      POSTGRES_USER: payguard
      POSTGRES_PASSWORD: payguard_dev
      POSTGRES_DB: payguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: payguard_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: payguard_api
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://payguard:payguard_dev@postgres:5432/payguard
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../modules:/app/modules
      - ../../integrations:/app/integrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: payguard_worker
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://payguard:payguard_dev@postgres:5432/payguard
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../apps/worker:/app/apps/worker
      - ../../modules:/app/modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m apps.worker.main

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: payguard_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: pnpm dev

volumes:
  postgres_data:
  redis_data:
