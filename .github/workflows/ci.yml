name: InvarPay AI CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql+asyncpg://payguard:payguard_dev@localhost:5432/payguard"
  REDIS_URL: "redis://localhost:6379/0"
  APP_ENV: "development"
  PAYMENT_PROVIDER: "fake"
  SECRET_KEY: "ci-test-secret-key-not-for-production"
  JWT_SECRET_KEY: "ci-test-jwt-secret-not-for-production"
  # No real provider credentials in CI — uses fake provider

jobs:
  python-checks:
    name: Python Lint, Type Check & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payguard
          POSTGRES_PASSWORD: payguard_dev
          POSTGRES_DB: payguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check apps/ modules/ integrations/ --output-format=github

      - name: Type check (mypy)
        run: python -m mypy apps/api/app modules/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Informational in Phase 1

      - name: Run database migrations
        run: python -m alembic -c apps/api/alembic.ini upgrade head

      - name: Run unit tests
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Run chaos tests
        run: python -m pytest tests/chaos/ -v --tb=short

      - name: Run security tests
        run: python -m pytest tests/security/ -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        continue-on-error: true

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run truffleHog (secret scan)
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Python dependencies
        run: pip-audit --ignore-vuln PYSEC-2024-76
        continue-on-error: true  # Advisory only in Phase 1

  node-checks:
    name: Node Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        run: pnpm type-check

  security-policy-check:
    name: Security Policy Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify no secrets in .env.example
        run: |
          if grep -E "(rzp_live_|sk_live_|prod.*key)" .env.example; then
            echo "FAIL: Live credentials found in .env.example!"
            exit 1
          fi
          echo "PASS: No live credentials in .env.example"

      - name: Verify .env is gitignored
        run: |
          if git check-ignore -q .env 2>/dev/null || grep -q "^\.env$" .gitignore; then
            echo "PASS: .env is in .gitignore"
          else
            echo "FAIL: .env is not in .gitignore!"
            exit 1
          fi

      - name: Check for hardcoded secrets patterns
        run: |
          # Check for common secret patterns in source code
          if git grep -E "rzp_live_[A-Za-z0-9]|sk_live_[A-Za-z0-9]|AKIA[A-Z0-9]{16}" -- apps/ modules/ integrations/ 2>/dev/null; then
            echo "FAIL: Possible hardcoded live credentials detected!"
            exit 1
          fi
          echo "PASS: No hardcoded live credentials detected"
